apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pet-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/ommundada16/pet-portal-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 16Mi }
            limits: { memory: 64Mi }
---
# NodePort exposes the site outside the cluster on port 30080 of every node
# (on a cloud cluster you would use a LoadBalancer or an Ingress instead)
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: pet-portal
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
