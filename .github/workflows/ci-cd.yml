# CI/CD pipeline for the Pet Adoption Portal.
#
#   every push / pull request :  test -> security -> build -> compose-test + k8s-test + iac-check
#   push to main only         :  ... -> push images to GHCR -> deploy to AWS with Ansible -> smoke test
#
# Stages from the syllabus:  Source (GitHub)  ->  Build  ->  Test  ->  Containerize  ->  Deploy  ->  Monitor

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 1. TEST
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (flake8)
        run: flake8 .
      - name: Unit tests with coverage (fails below 85%)
        run: pytest

  # ---------------------------------------------------------------- 2. SECURITY (DevSecOps)
  security:
    name: Security scan of the code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit pip-audit
      - name: Bandit - looks for insecure code patterns
        run: bandit -r app.py db.py
      - name: pip-audit - looks for known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt

  # ---------------------------------------------------------------- 3. BUILD
  build:
    name: Build Docker images
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      registry: ${{ steps.vars.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build both images. They are only pushed when this run is a push to main.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          load: true
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.vars.outputs.registry }}/pet-portal-backend:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.registry }}/pet-portal-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          load: true
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.vars.outputs.registry }}/pet-portal-frontend:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.registry }}/pet-portal-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # Scan the built images for known vulnerabilities (Trivy). Only CRITICAL issues that already
      # have a fix available fail the build.
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.registry }}/pet-portal-backend:${{ steps.vars.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.registry }}/pet-portal-frontend:${{ steps.vars.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ---------------------------------------------------------------- 4a. INTEGRATION TEST (Docker Compose)
  compose-test:
    name: Integration test with Docker Compose
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the whole app (database + backend + frontend)
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Smoke test
        run: ./scripts/smoke_test.sh http://localhost
      - name: Start the monitoring stack and check Prometheus sees the backend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
          for i in $(seq 1 30); do
            up=$(curl -s 'http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22backend%22%7D' | grep -o '"value":\[[^]]*"1"\]' || true)
            [ -n "$up" ] && echo "Prometheus is scraping the backend" && exit 0
            sleep 5
          done
          echo "Prometheus never saw the backend as up"; exit 1
      - name: Show logs if something failed
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml logs --tail=80

  # ---------------------------------------------------------------- 4b. INTEGRATION TEST (Kubernetes)
  k8s-test:
    name: Deploy to a Kubernetes cluster (kind)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a temporary Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pet-portal
      - name: Build images and load them into the cluster
        run: |
          docker build -t ghcr.io/ommundada16/pet-portal-backend:latest app/backend
          docker build -t ghcr.io/ommundada16/pet-portal-frontend:latest app/frontend
          kind load docker-image --name pet-portal \
            ghcr.io/ommundada16/pet-portal-backend:latest ghcr.io/ommundada16/pet-portal-frontend:latest
      - name: Deploy with the manifests in k8s/
        run: ./k8s/deploy.sh
      - name: Smoke test through a port-forward
        run: |
          kubectl port-forward -n pet-portal svc/frontend 8080:80 &
          sleep 5
          ./scripts/smoke_test.sh http://localhost:8080
      - name: Show cluster state if something failed
        if: failure()
        run: |
          kubectl get all -n pet-portal
          kubectl describe pods -n pet-portal | tail -60
          kubectl logs -n pet-portal deployment/backend --tail=50

  # ---------------------------------------------------------------- 4c. INFRASTRUCTURE CHECK
  iac-check:
    name: Validate Terraform and Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format + validate
        working-directory: terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
      - name: Ansible syntax check
        run: |
          pip install ansible
          ansible-playbook --syntax-check -i "localhost," ansible/deploy.yml

  # ---------------------------------------------------------------- 5. DEPLOY (main branch only)
  deploy:
    name: Deploy to AWS (Ansible)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, compose-test, k8s-test, iac-check]
    runs-on: ubuntu-latest
    environment: production
    env:
      # Set these in GitHub -> Settings -> Secrets and variables -> Actions. Until EC2_HOST is set,
      # the deploy steps are skipped so the rest of the pipeline stays green.
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy secrets are configured
        if: env.EC2_HOST == ''
        run: echo "::warning::EC2_HOST secret is not set - skipping the deploy"
      - name: Install Ansible
        if: env.EC2_HOST != ''
        run: pip install ansible
      - name: Run the Ansible playbook against the EC2 server
        if: env.EC2_HOST != ''
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem && chmod 600 key.pem
          ansible-playbook -i "${EC2_HOST}," -u ubuntu --private-key key.pem ansible/deploy.yml \
            -e image_tag=${{ needs.build.outputs.tag }} \
            -e registry=${{ needs.build.outputs.registry }} \
            -e git_ref=${{ github.sha }}
          rm -f key.pem
      - name: Smoke test the live site
        if: env.EC2_HOST != ''
        run: ./scripts/smoke_test.sh "http://${EC2_HOST}"
