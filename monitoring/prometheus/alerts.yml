# Alert rules. Each one maps to a Service Level Objective (SLO) described in the README:
#   SLO 1 - Availability: at least 99.5% of requests succeed (not 5xx)
#   SLO 2 - Latency:      95% of requests finish in under 500 ms

groups:
  - name: pet-portal
    rules:
      # A scrape target (backend / server) stopped answering
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"

      # SLO 1: more than 5% of requests are failing with 5xx errors
      - alert: HighErrorRate
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[5m])) or vector(0))
          / sum(rate(http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of API requests are failing (5xx)"

      # SLO 2: the slowest 5% of requests take longer than 500 ms
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile API latency is above 500 ms"

      # Many failed logins in a row can mean someone is guessing passwords
      - alert: LoginFailureSpike
        expr: sum(rate(pet_portal_logins_total{outcome="failure"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 1 failed login per second for 5 minutes"

      # Low memory is what crashed the earlier t3.micro server (see the post-mortem in the README)
      - alert: HighMemoryUsage
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Server memory usage is above 90%"
