services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: pet_adoption
    volumes:
      - mysql_data:/var/lib/mysql
      - ./app/backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./app/backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: pet_adoption
      SECRET_KEY: change-this-secret-key
    volumes:
      - pet_images:/app/uploads
    depends_on:
      - db
    ports:
      - "5000:5000"

  frontend:
    build: ./app/frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
    name: devopsproject_mysql_data
  pet_images:
    name: devopsproject_pet_images
