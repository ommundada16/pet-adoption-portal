---
# Configures the EC2 server and deploys the app + monitoring stack.
#
# Run by the CI/CD pipeline after every successful push to main, or by hand:
#   export MYSQL_ROOT_PASSWORD=... APP_SECRET_KEY=... GRAFANA_ADMIN_PASSWORD=...
#   ansible-playbook -i inventory.ini deploy.yml -e image_tag=<git-sha>
#
# It is idempotent: running it twice changes nothing the second time.

- name: Deploy Pet Adoption Portal to the EC2 instance
  hosts: all
  become: true

  vars:
    repo_url: "https://github.com/ommundada16/pet-adoption-portal.git"
    app_dir: /home/ubuntu/pet-adoption-portal
    git_ref: main                         # the pipeline passes the exact commit being deployed
    registry: ghcr.io/ommundada16
    image_tag: latest                     # the pipeline passes the git-sha tag of the tested images
    compose_files: "-f docker-compose.yml -f docker-compose.monitoring.yml"
    mysql_root_password: "{{ lookup('env', 'MYSQL_ROOT_PASSWORD') }}"
    app_secret_key: "{{ lookup('env', 'APP_SECRET_KEY') }}"
    grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"
    registry_user: "{{ lookup('env', 'REGISTRY_USER') }}"
    registry_token: "{{ lookup('env', 'REGISTRY_TOKEN') }}"

  tasks:
    - name: Make sure the required secrets were provided
      assert:
        that:
          - mysql_root_password | length > 0
          - app_secret_key | length > 0
          - grafana_admin_password | length > 0
        fail_msg: "Set MYSQL_ROOT_PASSWORD, APP_SECRET_KEY and GRAFANA_ADMIN_PASSWORD as environment variables"

    - name: Update apt package cache
      apt:
        update_cache: yes

    - name: Install Docker, the Compose plugin, and git
      apt:
        name:
          - docker.io
          - docker-compose-v2
          - git
        state: present

    - name: Add the ubuntu user to the docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    # A small cloud instance running MySQL + Flask + nginx + monitoring can run low
    # on memory under load. A swap file gives the kernel breathing room instead
    # of the OOM killer taking down sshd/services - this task is idempotent
    # (checks first, safe to run every deploy).
    - name: Check if a swap file already exists
      stat:
        path: /swapfile
      register: swap_file_check

    - name: Create a 2GB swap file
      command: fallocate -l 2G /swapfile
      when: not swap_file_check.stat.exists

    - name: Set swap file permissions
      file:
        path: /swapfile
        mode: '0600'
      when: not swap_file_check.stat.exists

    - name: Format the swap file
      command: mkswap /swapfile
      when: not swap_file_check.stat.exists

    - name: Enable the swap file
      command: swapon /swapfile
      when: not swap_file_check.stat.exists

    - name: Make swap permanent across reboots
      mount:
        path: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present

    - name: Fetch the project files (compose files + monitoring config) at the deployed commit
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ git_ref }}"
        force: yes

    # The .env file holds the real passwords. It is created on the server only - never stored in git.
    - name: Write the .env file with secrets and the image tag to deploy
      template:
        src: env.j2
        dest: "{{ app_dir }}/.env"
        mode: '0600'

    - name: Log in to the container registry so the server can pull the images
      shell: echo "{{ registry_token }}" | docker login ghcr.io -u "{{ registry_user }}" --password-stdin
      no_log: true
      when: registry_token | length > 0
      changed_when: false

    - name: Pull the exact image versions that passed the pipeline
      command: docker compose {{ compose_files }} pull backend frontend
      args:
        chdir: "{{ app_dir }}"
      changed_when: false

    - name: Start (or update) all containers - no building on the server
      command: docker compose {{ compose_files }} up -d --no-build --remove-orphans
      args:
        chdir: "{{ app_dir }}"

    - name: Wait until the API reports it is ready (database connected)
      uri:
        url: http://localhost/api/ready
        status_code: 200
      register: ready_check
      retries: 30
      delay: 5
      until: ready_check.status == 200
