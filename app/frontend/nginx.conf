server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;    # allow pet photo uploads

    # Forward API calls and uploaded photos to the backend.
    # "backend" is the service name - it works the same in Docker Compose and Kubernetes.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://backend:5000;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
