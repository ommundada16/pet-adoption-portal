<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Pet Adoption Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-brand">🐾 PetAdopt</div>
    <div class="form-container">
        <h2>Register</h2>
        <form id="registerForm">
            <label>Register as:</label>
            <select id="role">
                <option value="user">Adopter</option>
                <option value="shelter">Shelter/Admin</option>
            </select>

            <label>Name:</label>
            <input type="text" id="name" required>

            <label>Email:</label>
            <input type="email" id="email" required>

            <label>Password:</label>
            <input type="password" id="password" required>

            <label>Phone:</label>
            <input type="text" id="phone">

            <label>Address (shelters only):</label>
            <input type="text" id="address">

            <button type="submit" class="btn">Register</button>
        </form>
        <p id="message"></p>
        <p>Already have an account? <a href="login.html">Login</a></p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
