<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Pet Adoption Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-brand">🐾 PetAdopt</div>
    <div class="form-container">
        <h2>Login</h2>
        <form id="loginForm">
            <label>Login as:</label>
            <select id="role">
                <option value="user">Adopter</option>
                <option value="shelter">Shelter/Admin</option>
            </select>

            <label>Email:</label>
            <input type="email" id="email" required>

            <label>Password:</label>
            <input type="password" id="password" required>

            <button type="submit" class="btn">Login</button>
        </form>
        <p id="message"></p>
        <p>New here? <a href="register.html">Register</a></p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
