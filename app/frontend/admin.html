<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Pet Adoption Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="navbar">
        <a href="index.html" class="brand">🐾 PetAdopt</a>
        <div id="navLinks"></div>
    </div>

    <div class="hero">
        <h1 class="page-title">Shelter Dashboard</h1>
    </div>

    <div class="form-container">
        <h2>Add New Pet</h2>
        <form id="addPetForm">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="petName" required>
            </div>

            <div class="form-group">
                <label>Species</label>
                <select id="petSpecies">
                    <option value="Dog">Dog</option>
                    <option value="Cat">Cat</option>
                    <option value="Rabbit">Rabbit</option>
                    <option value="Bird">Bird</option>
                </select>
            </div>

            <div class="form-group">
                <label>Breed</label>
                <input type="text" id="petBreed">
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" id="petAge">
            </div>

            <div class="form-group">
                <label>Description</label>
                <input type="text" id="petDescription">
            </div>

            <button type="submit" class="btn">Add Pet</button>
        </form>
        <p id="addPetMessage"></p>
    </div>

    <div class="form-container" id="uploadSection" style="display:none;">
        <h2>Upload Photo for New Pet</h2>
        <div class="form-group">
            <input type="file" id="petImage" accept="image/*">
        </div>
        <button id="uploadBtn" class="btn">Upload</button>
        <p id="uploadMessage"></p>
    </div>

    <h2 class="page-title" style="font-size:22px;">Adoption Requests</h2>
    <div id="requestsList" class="list-card"></div>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
